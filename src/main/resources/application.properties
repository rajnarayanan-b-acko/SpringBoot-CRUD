spring.application.name=crud

#datasource setting postgresql
spring.datasource.url=jdbc:postgresql://localhost:5433/Assignment
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#jpa settings postgresql
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#server settings
server.port=8181

# Logging configuration

# Root logging level (default is INFO)
logging.level.root=INFO

# Set logging level for specific packages (DEBUG for your service)
logging.level.com.assignment.crud=DEBUG

# Log format pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG

